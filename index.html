<script>

  var STAT = { err: "", frames: 0, data: 0 };
  window.onerror = function (msg, src, line) { STAT.err = msg + " @" + line; };
  setInterval(function () {
    var el = document.getElementById("st"); if (!el || !STAT.err) return; // shown only when something is wrong
    el.textContent = "v3 · " + window.innerWidth + "x" + window.innerHeight + " dpr " + (window.devicePixelRatio || 1) +

</script>

// ---------- sky by hour, like the app ----------

function larva(p, x, base, u, t) {
  if (p.stage === "EGG") { fillStroke(oval(x, base - u * .7, u * .5, u * .7), grad(base - u * 1.4, base, hex(p.eggColor)), u * .06); return; }
  if (p.stage === "COCOON") { const c = new Path2D(); c.ellipse(x, base - u * .9, u * .35, u * .8, 0, 0, TAU); fillStroke(c, grad(base - u * 1.7, base, "#B08968"), u * .06); return; }
  const n = 4 + (p.level || 0) * 2, r = u * .32, sp = r * 1.3, x0 = x - sp * (n - 1) / 2;
  for (let i = 0; i < n; i++) { const hu = Math.pow(Math.max(0, Math.sin(t * 2.5 - i * .75)), 2), rr = i === n - 1 ? r * 1.3 : r, cx = x0 + i * sp, cy = base - rr - hu * r * .8;
    fillStroke(oval(cx, cy, rr, rr), grad(cy - rr, cy + rr, hex(i % 2 ? p.body2 : p.body)), u * .05);
    if (i === n - 1) { g.fillStyle = "#fff"; for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * rr * .38, cy - rr * .15, rr * .25, 0, TAU); g.fill(); }
      g.fillStyle = INK; for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * rr * .38, cy - rr * .15, rr * .13, 0, TAU); g.fill(); }
      g.strokeStyle = INK; g.lineWidth = u * .05; g.beginPath(); g.moveTo(cx - rr * .25, cy + rr * .38); g.quadraticCurveTo(cx, cy + rr * .7, cx + rr * .25, cy + rr * .38); g.stroke();
      g.lineWidth = u * .04; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * rr * .3, cy - rr * .8); g.lineTo(cx + s * rr * .5, cy - rr * 1.6); g.stroke(); g.fillStyle = hex(p.antenna); g.beginPath(); g.arc(cx + s * rr * .5, cy - rr * 1.6, rr * .17, 0, TAU); g.fill(); } } }
}

// ---------- flight: free, visits, rest, shelters, chases (like Garden.kt) ----------
function fly(i, seed, t, sp, n, depth = 0) {
  const r = jrandom(mixSeed(seed * 31n + BigInt(i)));
  const a = r() * TAU, b = r() * TAU, sx = .02 + r() * .03, sy = .12 + r() * .2, period = 26 + r() * 14, phase = r() * period;
  const free = tt => ({ x: W * (.5 + .47 * Math.sin(tt * sx + a)), y: H * (.33 + .2 * Math.sin(tt * sy + b)) });
  const cycle = Math.floor((t + phase) / period), u = t + phase - cycle * period, roll = hash(i + 1, cycle);
  const k = u < 13 ? 0 : u < 16 ? ease((u - 13) / 3) : u < 22 ? 1 : u < 25 ? 1 - ease((u - 22) / 3) : 0;
  const p0 = free(t); let tg = null, spot = -1, inside = false;
  if (k > 0) {
    if (sp.length && roll % 5) { spot = roll % sp.length; tg = { x: sp[spot].x + ((i % 3) - 1) * H * .012, y: sp[spot].y }; inside = sp[spot].inside; }
    else if (n > 1 && depth < 1) { const o = fly((i + n - 1) % n, seed, t - .7, [], n, depth + 1); tg = { x: o.x - H * .05, y: o.y + H * .02 }; }
  }
  const x = tg ? p0.x + (tg.x - p0.x) * k : p0.x, y = tg ? p0.y + (tg.y - p0.y) * k : p0.y;
  const resting = tg && spot >= 0 && k >= .999;
  return { x, y, spot: resting ? spot : -1, alpha: inside ? 1 - ease((k - .85) / .15) : 1,
    flap: resting ? .8 + .2 * Math.abs(Math.cos(t * 1.2 + i)) : .45 + .55 * Math.abs(Math.cos(t * 6 + i)), tilt: resting ? 0 : Math.sin(t + i) * .2 };
}

function frame(now) {
  requestAnimationFrame(frame); // keep going even if one frame fails
  try {
    STAT.frames++;
    resize();
    const t = (now - T0) / 1000;
    // splash for at least 3 s and until the phone has sent the garden, then a 1.2 s cross-fade
    const fade = GOT ? Math.min(1, Math.max(0, (t - Math.max(3, GOT)) / 1.2)) : 0;
    if (fade > 0) draw(now);
    if (fade < 1) { g.save(); g.globalAlpha = 1 - fade; splash(t); g.restore(); }
    if (BIRTH) { const age = t - BIRTH.t; if (age > 11) BIRTH = null; else { g.save(); g.globalAlpha = Math.min(1, age / .6, (11 - age) / .8); birth(BIRTH.b, age, t); g.restore(); } }
    if (STAT.frames % 60 === 1) { // what the canvas really holds (sample near the top-left)
      STAT.cv = cv.width + "x" + cv.height + " css " + cv.clientWidth + "x" + cv.clientHeight;
      const d = g.getImageData(20, 20, 1, 1).data; STAT.px = d[0] + "," + d[1] + "," + d[2];
    }
  } catch (e) { showErr(e); }
}

// ---------- relive a birth (sent from the album) ----------
function birth(b, a, t) {
  const cx = W / 2, cy = H * .45, m = H * .42, wc = hex(b.w1), love = Math.min(1, (b.bond || 0) / 100);
  const split = 2.3, fly0 = 3.8, land = 5.8, dawn = ease((a - split) / 3);
  const sg = g.createLinearGradient(0, 0, 0, H); sg.addColorStop(0, mix("#070B1E", "#3A3478", dawn)); sg.addColorStop(.7, mix("#22163F", "#FF9E6B", dawn)); sg.addColorStop(1, mix("#141236", "#FFD9A0", dawn));
  g.fillStyle = sg; g.fillRect(0, 0, W, H);
  const r = rng(42); for (let i = 0; i < 90; i++) { const tw = (Math.sin(t * 2 + i) + 1) / 2; g.fillStyle = `rgba(255,255,255,${(.2 + .7 * tw) * (1 - dawn)})`; g.beginPath(); g.arc(r() * W, r() * H * .8, 1 + 1.6 * tw, 0, TAU); g.fill(); }
  // light and rays
  const beat = [.6, 1.3, 1.9].reduce((s, k) => s + (a >= k ? Math.exp(-(a - k) * 6) : 0), 0), inner = Math.min(1, a / split);
  const gl = g.createRadialGradient(cx, cy, 0, cx, cy, m * (1 + .4 * beat)); gl.addColorStop(0, mix(wc, "#ffffff", .4)); gl.addColorStop(1, "rgba(0,0,0,0)");
  g.globalAlpha *= 1; g.save(); g.globalAlpha *= .35 + .4 * inner + .2 * beat; g.fillStyle = gl; g.fillRect(0, 0, W, H); g.restore();
  if (a > land) { const ra = ease((a - land) / .8); g.save(); g.translate(cx, cy); g.rotate(t * .15);
    for (let k = 0; k < 16; k++) { const a0 = k * TAU / 16; g.fillStyle = `rgba(255,236,179,${.18 * ra})`; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a0 - .09) * W, Math.sin(a0 - .09) * W); g.lineTo(Math.cos(a0 + .09) * W, Math.sin(a0 + .09) * W); g.fill(); } g.restore(); }
  // the cocoon: beats, shakes, splits
  const open = Math.min(1, Math.max(0, (a - split) / 1.2));
  if (open < 1) for (const side of [-1, 1]) { g.save(); const fall = open * open; g.translate(cx + side * open * m * .5, cy + fall * H * .7); g.rotate(side * fall * 1.2 + Math.sin(a * 40) * .03 * (a > 1.8 && a < split ? 1 : 0));
    g.beginPath(); g.rect(side < 0 ? -m : 0, -m, m, 2 * m); g.clip(); const sc = 1 + .07 * beat;
    const c = new Path2D(); c.ellipse(0, 0, m * .17 * sc, m * .36, 0, 0, TAU); fillStroke(c, grad(-m * .36, m * .36, mix("#B08968", wc, .3 * inner)), m * .012);
    g.globalAlpha *= .6 * inner; g.fillStyle = wc; g.fill(c); g.restore(); }
  if (a > split && a < split + .5) { g.fillStyle = `rgba(255,255,255,${.85 * (1 - (a - split) / .5)})`; g.fillRect(0, 0, W, H); }
  // the butterfly: unfolds, flies a loop, lands
  if (a > split) {
    const unfold = ease((a - split - .2) / 1.4), grow = .45 + .55 * ease((a - split) / 1.4);
    let x = cx, y = cy, flap = .08 + .92 * unfold * (.75 + .25 * Math.abs(Math.cos((a - split) * 2.5)));
    if (a > fly0) { const e = ease((a - fly0) / (land - fly0)); x = cx + Math.sin(e * TAU) * W * .3; y = cy - Math.sin(e * TAU * 2) * H * .18;
      flap = a < land ? .3 + .7 * Math.abs(Math.cos(t * 11)) : .55 + .45 * Math.abs(Math.cos(t * 5));
      for (let k = 1; k <= 24; k++) { const tk = a - k * .03; if (tk < fly0 || tk > land) continue; const ek = ease((tk - fly0) / (land - fly0)), q = 1 - k / 24;
        if (love >= .4 && k % 5 === 2) { g.fillStyle = `rgba(255,82,119,${q})`; g.font = `${Math.round(H * .03)}px sans-serif`; g.fillText("❤", cx + Math.sin(ek * TAU) * W * .3, cy - Math.sin(ek * TAU * 2) * H * .18); }
        else { g.fillStyle = `rgba(255,255,255,${.7 * q})`; g.beginPath(); g.arc(cx + Math.sin(ek * TAU) * W * .3, cy - Math.sin(ek * TAU * 2) * H * .18, H * .006 * (1 + q), 0, TAU); g.fill(); } } }
    if (a > land) y += Math.sin((a - land) * 2) * H * .015;
    butterfly(b, flap, x, y, m * grow, t);
  }
  // confetti at the landing, more for rarer butterflies
  if (a > land) { const pr = rng(b.seed + 3), n = [40, 60, 80, 90][b.v] || 40, d = a - land, cols = [wc, hex(b.w2), "#ffffff", "#FFD54F"];
    for (let i = 0; i < n; i++) { const an = pr() * TAU, v = H * (.5 + pr() * .9), col = cols[i % 4], k = (1 - Math.exp(-2.2 * d)) / 2.2;
      const px = cx + Math.cos(an) * v * k, py = cy + (Math.sin(an) * v - H * .4) * k + .5 * H * .5 * d * d; if (py > H) continue;
      g.save(); g.translate(px, py); g.rotate(d * (pr() - .5) * 12); g.fillStyle = col; g.globalAlpha *= Math.max(0, 1 - d / 4); g.fillRect(-7, -3.5, 14, 7); g.restore(); } }
  // caption
  if (a > land + .3) { const ca = Math.min(1, (a - land - .3) / .6); g.save(); g.globalAlpha *= ca; g.textAlign = "center"; g.fillStyle = "#fff"; g.shadowColor = mix(wc, "#000000", .3); g.shadowBlur = 24;
    g.font = `700 ${Math.round(H * .09)}px Georgia, serif`; g.fillText("🦋 " + b.n + (["", " 💎", " ✨", " 🏆"][b.v] || "") + (b.bond >= 100 ? " 💞" : ""), cx, H * .86);
    g.shadowBlur = 8; g.font = `500 ${Math.round(H * .04)}px "Google Sans", Roboto, sans-serif`;
    const hearts = "❤".repeat(Math.ceil((b.bond || 0) / 20)); g.fillText((b.parent ? "🐛 " + b.parent + "   " : "") + hearts, cx, H * .94); g.restore(); }
}

// ---------- splash ----------
function splash(t) {
  const sg = g.createLinearGradient(0, 0, 0, H); sg.addColorStop(0, "#5D6BC4"); sg.addColorStop(.6, "#FFB48A"); sg.addColorStop(1, "#FFE6C4");
  g.fillStyle = sg; g.fillRect(0, 0, W, H);
  const sx = W * .5, sy = H * .62, rg = g.createRadialGradient(sx, sy, 0, sx, sy, H * .6); rg.addColorStop(0, "rgba(255,245,157,.8)"); rg.addColorStop(1, "rgba(255,245,157,0)");
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.fillStyle = "#FFB74D"; g.beginPath(); g.arc(sx, sy, H * .09, 0, TAU); g.fill();
  const hill = (y0, amp, ph, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W; x += W / 60) g.lineTo(x, y0 + Math.sin(x / W * TAU * 1.5 + ph) * amp); g.lineTo(W, H); g.fill(); };
  hill(H * .66, H * .03, .5, "#8FA88A"); hill(H * .74, H * .025, 2, "#5E9A45"); hill(H * .82, H * .015, 4, "#4E8A2E");
  // a caterpillar crawling across
  const pet = { stage: "LARVA", level: 1, body: 0x7CB342, body2: 0x558B2F, antenna: 0xF5A623 };
  const cx = ((t * .09) % 1.3 - .15) * W; larva(pet, cx, H * .84, H * .09, t * 1.4);
  // a few butterflies
  const cols = [[0xF5A623, 0xFFD27A, 0x5A3A12], [0x5BB8F5, 0xB9E3FF, 0x16405E], [0xAB47BC, 0x4FC3F7, 0xFFEB3B], [0xFF7F50, 0xFFC1A8, 0x7A2E12]];
  cols.forEach((c, i) => { const x = W * (.5 + .38 * Math.sin(t * (.18 + i * .05) + i * 1.7)), y = H * (.3 + .12 * Math.sin(t * (.4 + i * .1) + i));
    butterfly({ s: i === 2 ? 7 : i, seed: 40 + i * 9, v: 0, w1: c[0], w2: c[1], a: c[2] }, .45 + .55 * Math.abs(Math.cos(t * 6 + i)), x, y, H * .1, t); });
  // title
  const a = Math.min(1, t / 1.2), sz = Math.round(H * .11);
  g.save(); g.globalAlpha *= a; g.textAlign = "center"; g.font = `700 ${sz}px Georgia, "Times New Roman", serif`;
  g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 18; g.fillStyle = "#fff"; g.fillText("Bruchino Garden", W / 2, H * .2 + (1 - a) * 30);
  g.shadowBlur = 0; g.font = `500 ${Math.round(H * .035)}px "Google Sans", Roboto, sans-serif`; g.fillStyle = "rgba(255,255,255,.9)";
  const dots = ".".repeat(1 + Math.floor(t * 2) % 3); g.fillText(GOT ? "🦋" : "🐛 " + dots, W / 2, H * .28);
  g.restore();
}
function draw(now) {
  const t = (now - T0) / 1000, d = DATA || { butterflies: [], decos: [{ id: "perch", x: .5, y: .5 }], pet: null };
  const date = new Date(), hour = date.getHours() + date.getMinutes() / 60, night = hour >= 20 || hour < 7, ss = season(date.getMonth() + 1);
  meadow(t, night, hour, ss);
  const laid = d.decos.slice().sort((p, q) => p.y - q.y).map(p => ({ p, x: p.x * W, y: groundY(p.y), u: unitAt(p.y) }));
  const sp = []; laid.forEach((l, i) => sp.push(...spots(l.p.id, l.x, l.y, l.u, i)));
  const bs = d.butterflies.slice(-40), ft = flightT(), seeds = bs.map(b => BigInt(b.sd || Math.round(b.seed || 0))), flies = bs.map((b, i) => fly(i, seeds[i], ft, sp, bs.length));
  const busy = new Set(flies.filter(f => f.spot >= 0).map(f => sp[f.spot].deco));
  laid.forEach((l, i) => deco(l.p.id, l.x, l.y, l.u, t, ss, busy.has(i), d.pet));
  const m = H * .11;
  // nectar: a flower blooms where the user tapped and the butterflies gather round it for a while
  let pull = 0, nx = 0, ny = 0;
  if (NECTAR) { let age = ((ft - NECTAR.t0) % FLIGHT_LOOP + FLIGHT_LOOP) % FLIGHT_LOOP; if (age > FLIGHT_LOOP / 2) age -= FLIGHT_LOOP;
    if (age > 14) NECTAR = null; else {
    nx = NECTAR.x * W; ny = groundY(Math.min(1, Math.max(0, NECTAR.d || 0)));
    pull = ease(age / 2.5) * (1 - ease((age - 11) / 3));
    const gr = ease(age / .8), u = unitAt(.5);
    g.strokeStyle = "#3E8E2E"; g.lineWidth = u * .08; g.beginPath(); g.moveTo(nx, ny); g.lineTo(nx, ny - u * 1.1 * gr); g.stroke();
    const gl = g.createRadialGradient(nx, ny - u * 1.1 * gr, 0, nx, ny - u * 1.1 * gr, u * 1.4); gl.addColorStop(0, "rgba(255,245,157,.6)"); gl.addColorStop(1, "rgba(255,245,157,0)");
    g.fillStyle = gl; g.beginPath(); g.arc(nx, ny - u * 1.1 * gr, u * 1.4, 0, TAU); g.fill();
    flower(nx, ny - u * 1.1 * gr, u * .22 * gr, "#F48FB1"); } }
  bs.forEach((b, i) => { const f = flies[i]; if (f.alpha <= .01) return;
    if (pull > 0) { const a = i * 2.4 + ft * .6, rr = H * (.06 + .03 * (i % 3)), k = pull * .9;
      f.x += (nx + Math.cos(a) * rr - f.x) * k; f.y += (ny - unitAt(.5) * 1.3 + Math.sin(a) * rr * .6 - f.y) * k; }
    g.save(); g.globalAlpha = f.alpha; g.translate(f.x, f.y); g.rotate(f.tilt); g.translate(-f.x, -f.y);
    butterfly(b, f.flap, f.x, f.y, f.spot >= 0 ? m * .7 : m, t); g.restore(); });
  if (d.pet && d.pet.name) { g.font = `600 ${Math.round(H * .04)}px "Google Sans", Roboto, sans-serif`; g.fillStyle = "#fff"; g.shadowColor = "rgba(0,0,0,.45)"; g.shadowBlur = 12;
    g.fillText("🐛 " + d.pet.name + "   🦋 " + d.butterflies.length, H * .05, H * .08); g.shadowBlur = 0; }
}
requestAnimationFrame(frame);

// ---------- Cast ----------
try {
  const ctx = cast.framework.CastReceiverContext.getInstance();
  ctx.addCustomMessageListener(NS, e => {
    try {
      STAT.data++; const m = typeof e.data === "string" ? JSON.parse(e.data) : e.data, now = (performance.now() - T0) / 1000;
      if (m.type === "nectar") { NECTAR = { x: m.x, d: m.d, t0: m.t0 != null ? m.t0 : flightT() }; play("chime", .8); } // a tap on the meadow (flight clock, as on the phone)
      else if (m.type === "pet") { JOY = now; play("giggle"); setTimeout(() => play("heart", .7), 250); }                                     // the pet on the perch was tapped
      else if (m.type === "birth") { BIRTH = { b: m.b, t: now }; // the cocoon beats, cracks open, the butterfly lands
        [[.6, "heart", .5], [1.3, "heart", .6], [1.9, "heart", .7], [2.3, "crack", 1], [5.8, "chime", 1]].forEach(([s, k, v]) => setTimeout(() => play(k, v), s * 1000)); }                  // relive a birth from the album
      else { DATA = m; if (!GOT) GOT = now; }
    } catch (err) { showErr(err); }
  });
  const opts = new cast.framework.CastReceiverOptions(); opts.disableIdleTimeout = true; opts.skipPlayersLoad = true;
  ctx.start(opts);
} catch (err) { /* opened in a normal browser: shows the demo garden */ }
</script>
</body>
