<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruchino Garden</title>
<!-- Bruchino on the TV: the user's garden, sent by the phone app over Cast (namespace urn:x-cast:cloud.shazam.bruchino).
     Same rules as the app's Garden.kt: free flight, visits to the decorations, resting, shelters. -->
<script>
  // Plain old JavaScript on purpose: works on any Chromecast and catches errors of the scripts below.
  var STAT = { err: "", frames: 0, data: 0 };
  window.onerror = function (msg, src, line) { STAT.err = msg + " @" + line; };
  setInterval(function () {
    var el = document.getElementById("st"); if (!el || !STAT.err) { if (el) el.textContent = ""; return; } // first 30 s, then only on errors
    el.textContent = "v6 cache " + (STAT.cache || "?") + " " + navigator.userAgent.slice(-70) + " · " + window.innerWidth + "x" + window.innerHeight + " dpr " + (window.devicePixelRatio || 1) +
      " · frames " + STAT.frames + " · data " + STAT.data + " · canvas " + (STAT.cv || "?") + " · px " + (STAT.px || "?") + (STAT.err ? " · ERR " + STAT.err : "");
  }, 1000);
</script>
<style>
  html, body { margin: 0; height: 100%; background: #0b1630; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 10; }
  /* the Cast framework adds its own full-screen (black) media player: we do not play media */
  cast-media-player { display: none !important; }
  /* diagnostics: if drawing fails on the TV, the error is written here in small */
  #st { z-index: 13; position: fixed; left: 14px; top: 10px; color: #fff; font: 16px monospace; text-shadow: 0 1px 3px #000; opacity: .8; }
  /* static splash: plain HTML, so it shows at once (before any script is loaded) */
  #splash { z-index: 11; position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(#0b1630, #2e2560 60%, #4a3a78); color: #fff; font-family: Georgia, serif; transition: opacity 1.2s; }
  #splash h1 { font-size: 9vh; margin: 0; text-shadow: 0 4px 24px rgba(255,224,130,.45); }
  #splash p { font: 3.4vh "Google Sans", Roboto, sans-serif; opacity: .8; margin-top: 2vh; }
  #err { z-index: 12; position: fixed; left: 12px; bottom: 10px; color: #ffeb3b; font: 18px monospace; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<div id="splash"><h1>🦋 Bruchino Garden</h1><p>🐛 🌸 🦋</p></div>
<canvas id="c"></canvas>
<div id="err"></div>
<div id="st"></div>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js" defer></script>
<script>

let ERR = "";

let GOT = 0; // time the first garden arrived
let NECTAR = null, BIRTH = null, JOY = -99, ROOMCLOSE = null, MSG = null, LEAVES = [], ANT = null; // Mimì: leaflets [i, x, depth], trip {i, t0}
const SFX = {toc: "sfx/toc.wav", boing: "sfx/boing.wav", snore: "sfx/snore.wav", chime: "sfx/chime.wav", heart: "sfx/heart.wav", crack: "sfx/crack.wav", giggle: "sfx/giggle.wav"};
// ---------- sounds (the app's own) ----------
let AC = null; const BUF = {};

// ---------- helpers ----------
const TAU = Math.PI * 2, INK = "#2B2A26";

// ---------- sky by hour, like the app ----------
const SKY = [[0, "#0D1B3A", "#2B2459"], [5.5, "#0D1B3A", "#2B2459"], [6.5, "#5D6BC4", "#FFB48A"], [7.5, "#A9D8FF", "#FFE6C4"],
  [9, "#BFE6FF", "#FFF3D9"], [17, "#BFE6FF", "#FFF3D9"], [18.5, "#7A86D6", "#FF9E6B"], [19.7, "#3A3478", "#B0607A"], [20.5, "#0D1B3A", "#2B2459"], [24, "#0D1B3A", "#2B2459"]];
function skyFor(h) { let i = 0; while (i < SKY.length - 2 && SKY[i + 1][0] <= h) i++; const a = SKY[i], b = SKY[i + 1], k = Math.min(1, Math.max(0, (h - a[0]) / (b[0] - a[0]))); return [mix(a[1], b[1], k), mix(a[2], b[2], k)]; }

let BG = null, BGK = ""; // sky, sun or moon and hills change slowly: drawn once into a canvas, refreshed every few minutes
function meadow(t, night, hour, ss) {

// ---------- butterflies (same shapes as the app) ----------

    const h = m * (.88 + r() * .16), w = h * im.width / im.height, hue = (r() - .5) * 24;

  let w1 = hex(b.w1), w2 = hex(b.w2), acc = hex(b.a);

    g.fillStyle = "rgba(255,255,255,.75)"; for (let k = 0; k <= 6; k++) { const a = -1.45 + k * .26; g.beginPath(); g.arc(Math.cos(a) * m * .43, Math.sin(a) * m * .36 - m * .02, m * .012, 0, TAU); g.fill(); }
    const n = 2 + Math.floor(r() * 4); g.fillStyle = rainbow ? "#fff" : acc;

// ---------- decorations ----------
const unitAt = y => H * (.075 + .04 * y), groundY = y => H * (.71 + .2 * y);

let NIGHTD = false, ANTHOME = null, FRIEND = {}; // set by draw(): decorations dim at night like Garden.kt
// little touches on the illustrated decorations: in the evening the cottage window glows and the chimney smokes, the mushroom lights up
function glow(x, y, r, a) { const gl = g.createRadialGradient(x, y, 0, x, y, r); gl.addColorStop(0, `rgba(255,214,120,${a})`); gl.addColorStop(1, "rgba(255,214,120,0)"); g.fillStyle = gl; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function decoLife(id, x, y, u, t) {

    for (let k = 0; k < 5; k++) { const tw = (Math.sin(t * 2.2 + k * 1.3) + 1) / 2; glow(x + u * (-.6 + k * .3), y - u * (1.35 + Math.sin(k) * .12), u * .12, .3 + .5 * tw); } }
}

  let J = 99; if (id === "ant" || id === "ladybug" || id === "bee") { t = flightT(); if (FRIEND[id] != null) J = ageOf(t, FRIEND[id]); } // friends: flight clock, same as the phone

// ---------- flight: free, visits, rest, shelters, chases (like Garden.kt) ----------
const FLYP = {}, SEEDS = {};

      { const d = g.getImageData(20, 20, 1, 1).data; STAT.px = d[0] + "," + d[1] + "," + d[2]; } // the Shield shows the canvas only with this read-back (found by testing); elsewhere it just slows the TV down
    }

}

// ---------- rooms: the garden decorations as little scenes (data in rooms/<id>.json, same as core/Rooms.kt) ----------
const ROOMS = {}; let ROOM = null; // {id, st, open, close}
function loadRoom(id) { if (ROOMS[id] || !id) return; ROOMS[id] = "loading";

  if (e.cyc != null && n(e.cyc) % e.of !== e.i) return false;
  if (e.pick != null && Math.floor((n(e.on) - 1) / 2) % e.of !== e.pick) return false;
  if (e.c && !e.c.every(([id, m, v]) => n(id) % m === v)) return false;
  if (e.same && !(e.same.every(id => n(id) > 0) && e.same.every(id => n(id) % e.of === n(e.same[0]) % e.of))) return false;

}

    if (e.k === "sky" && e.full) { roomSky(e, T, s, ox, oy); continue; }

    else { const gl = g.createRadialGradient(e.x, e.y, 0, e.x, e.y, 320); gl.addColorStop(0, "rgba(255,245,157,.7)"); gl.addColorStop(1, "rgba(255,245,157,0)"); g.fillStyle = gl; g.fillRect(e.x - 320, e.y - 320, 640, 640);
      g.fillStyle = "#FFD54F"; g.beginPath(); g.arc(e.x, e.y, 60, 0, TAU); g.fill(); }

  g.save(); const cl = new Path2D(); cl.rect(e.x, e.y, e.w, e.h); g.clip(cl);
  const gr = g.createLinearGradient(0, e.y, 0, e.y + e.h); gr.addColorStop(0, c[0]); gr.addColorStop(1, c[1]); g.fillStyle = gr; g.fillRect(e.x, e.y, e.w, e.h);
  if (night) { const r = rng(7); for (let i = 0; i < 18; i++) { g.fillStyle = `rgba(255,255,255,${.4 + .6 * ((Math.sin(T * 2 + i) + 1) / 2)})`; g.beginPath(); g.arc(e.x + r() * e.w, e.y + r() * e.h * .8, 2, 0, TAU); g.fill(); }
    g.fillStyle = "#FFF6C9"; g.beginPath(); g.arc(e.x + e.w * .72, e.y + e.h * .3, 26, 0, TAU); g.fill(); }
  else { g.fillStyle = "#FFD54F"; g.beginPath(); g.arc(e.x + e.w * .75, e.y + e.h * .28, 30, 0, TAU); g.fill();

function roomParts(e, T) {
  const r = rng(e.x * 7 + e.y);

    if (e.p === "dust") { const x = e.x + a * e.w + Math.sin(T * .4 + i) * 18, y = e.y + ((b * e.h + T * (6 + c * 8)) % e.h); g.fillStyle = `rgba(255,255,240,${.35 + .4 * c})`; g.beginPath(); g.arc(x, y, 3 + c * 2, 0, TAU); g.fill(); }
    else if (e.p === "zzz") { const p = (T * .35 + i / e.n) % 1; g.globalAlpha = Math.sin(p * Math.PI); g.fillStyle = "#5C6BC0"; g.font = `bold ${Math.round(28 + p * 34)}px sans-serif`; g.textAlign = "center";
      g.fillText("z", e.x + e.w * (.2 + p * .6) + Math.sin(p * 7) * 12, e.y + e.h * (1 - p)); g.globalAlpha = 1; }
    else if (e.p === "sparkle") { const tw = Math.pow((Math.sin(T * 3 + i * 1.7) + 1) / 2, 2); g.fillStyle = `rgba(255,236,140,${tw})`; star(e.x + a * e.w, e.y + b * e.h, 6 + 10 * tw); }
    else if (e.p === "heart") { const p = (T * .3 + a) % 1; g.globalAlpha = 1 - p; heart(e.x + a * e.w + Math.sin(T + i) * 10, e.y + e.h * (1 - p), 14, "#FF5277"); g.globalAlpha = 1; }
    else if (e.p === "bubble") { const p = (T * .2 * (.6 + c) + a) % 1, x = e.x + b * e.w + Math.sin(T * 2 + i) * 10, y = e.y + e.h * (1 - p), rr = 6 + 10 * c;
      g.strokeStyle = `rgba(255,255,255,${.75 * (1 - p * .5)})`; g.lineWidth = 3; g.beginPath(); g.arc(x, y, rr, 0, TAU); g.stroke(); g.fillStyle = "rgba(255,255,255,.6)"; g.beginPath(); g.arc(x - rr * .35, y - rr * .35, rr * .25, 0, TAU); g.fill(); }
    else if (e.p === "firefly") { const x = e.x + e.w * (.5 + .45 * Math.sin(T * .3 * (1 + c) + i * 2)), y = e.y + e.h * (.5 + .45 * Math.cos(T * .4 * (1 + b) + i)), gl = Math.pow((Math.sin(T * 3 + i * 2) + 1) / 2, 2);
      g.fillStyle = `rgba(255,245,157,${.3 * gl})`; g.beginPath(); g.arc(x, y, 18, 0, TAU); g.fill(); g.fillStyle = `rgba(255,249,196,${.4 + .6 * gl})`; g.beginPath(); g.arc(x, y, 5, 0, TAU); g.fill(); }
    else if (e.p === "snow" || e.p === "petal" || e.p === "leaf") { const p = (T * .06 * (1 + c) + b) % 1, x = e.x + a * e.w + Math.sin(T + i) * 25, y = e.y + e.h * p;
      if (e.p === "snow") { g.fillStyle = "rgba(255,255,255,.9)"; const q = 4 + 3 * c; g.fillRect(x - q / 2, y - q / 2, q, q); continue; } // pollen/snow: plain squares, cheap on slow boxes
      g.save(); g.translate(x, y); g.rotate(T * (1 + c) + i);
      { g.fillStyle = e.p === "petal" ? "#F8BBD0" : ["#E65100", "#FF8F00", "#C62828"][i % 3]; g.beginPath(); g.ellipse(0, 0, 14, 7, 0, 0, TAU); g.fill(); }
      g.restore(); }
    else if (e.p === "drop") { const p = (T * (.9 + c * .6) + b) % 1, x = e.x + a * e.w, y = e.y + e.h * p; g.fillStyle = `rgba(225,245,254,${.9 * (1 - p * .6)})`; g.beginPath(); g.ellipse(x, y, 5, 8, 0, 0, TAU); g.fill(); } }
}

// ---------- splash ----------
function draw(now) {
  const t = (now - T0) / 1000, d = DATA || { butterflies: [], decos: [{ id: "perch", x: .5, y: .5 }], pet: null };
  const date = new Date(), hour = date.getHours() + date.getMinutes() / 60, night = hour >= 20 || hour < 7, ss = season(date.getMonth() + 1); SEASON = ss;
  meadow(t, night, hour, ss);
  const laid = d.decos.slice().sort((p, q) => p.y - q.y).map(p => ({ p, x: p.x * W, y: groundY(p.y), u: unitAt(p.y) }));
  const sp = []; laid.forEach((l, i) => sp.push(...spots(l.p.id, l.x, l.y, l.u, i)));
  const bs = d.butterflies.slice(-40), ft = flightT(), seeds = bs.map(b => SEEDS[b.sd || b.seed] || (SEEDS[b.sd || b.seed] = BigInt(b.sd || Math.round(b.seed || 0)))), flies = bs.map((b, i) => fly(i, seeds[i], ft, sp, bs.length));
  const busy = new Set(flies.filter(f => f.spot >= 0).map(f => sp[f.spot].deco));
  NIGHTD = night; ANTHOME = null;
  laid.forEach((l, i) => deco(l.p.id, l.x, l.y, l.u, t, ss, busy.has(i), d.pet));
  const m = H * .11;
  // Mimì's leaflets, and Mimì going to fetch one (same timing as Garden.kt)
  const ft2 = flightT(), ua = unitAt(.6), home = ANTHOME; let antAt = home ? [home[0] + Math.cos(ft2 * .7) * ua * .9, home[1] + ua * .15] : null, carry = false, left = Math.sin(ft2 * .7) > 0, awalk = true;
  if (antAt && FRIEND.ant != null) { const a = ageOf(ft2, FRIEND.ant); if (a >= 0 && a <= 1.6) { antAt[1] -= Math.abs(Math.sin(a / .4 * Math.PI)) * ua * .3; awalk = false; } }
  for (const [i, x, dd] of LEAVES) { const u = unitAt(dd), lx = x * W, ly = groundY(dd) - u * .15;
    if (ANT && ANT.i === i && home) { const trip = Math.min(7, Math.max(2, 2 * Math.hypot(lx - home[0], ly - home[1]) / (ua * 4))), k = ageOf(ft2, ANT.t0) / trip;
      if (k >= 1) { ANT = null; LEAVES = LEAVES.filter(s => s[0] !== i); continue; }
      if (k >= 0) { const out = k < .5, f = out ? k * 2 : 2 - k * 2; antAt = [home[0] + (lx - home[0]) * f, home[1] + (ly - home[1]) * f]; carry = !out; left = (lx < home[0]) === out; if (!out) continue; } }
    const gl = g.createRadialGradient(lx, ly, 0, lx, ly, u * .6); gl.addColorStop(0, "rgba(255,245,157,.6)"); gl.addColorStop(1, "rgba(255,245,157,0)"); g.fillStyle = gl; g.beginPath(); g.arc(lx, ly, u * .6, 0, TAU); g.fill();

  if (antAt) ant(antAt[0], antAt[1], ua * .24, t, left, awalk || carry, carry);

  let pull = 0, nx = 0, ny = 0;
  if (NECTAR) { let age = ((ft - NECTAR.t0) % FLIGHT_LOOP + FLIGHT_LOOP) % FLIGHT_LOOP; if (age > FLIGHT_LOOP / 2) age -= FLIGHT_LOOP;
    if (age > 14) NECTAR = null; else {
    nx = NECTAR.x * W; ny = groundY(Math.min(1, Math.max(0, NECTAR.d || 0)));

// ---------- Cast (the framework is loaded with defer: start once it is there) ----------
window.addEventListener("DOMContentLoaded", function startCast() { try {
  const ctx = cast.framework.CastReceiverContext.getInstance();
  ctx.addCustomMessageListener(NS, e => {
    try {
      STAT.data++; const m = typeof e.data === "string" ? JSON.parse(e.data) : e.data, now = (performance.now() - T0) / 1000;
      if (m.type === "nectar") { NECTAR = { x: m.x, d: m.d, t0: m.t0 != null ? m.t0 : flightT() }; play("chime", .8); } // a tap on the meadow (flight clock, as on the phone)
      else if (m.type === "room") { // a decoration's little scene, driven by the phone

        else { loadRoom(m.id); ROOM = { id: m.id, st: m.st || {}, open: ROOM && ROOM.id === m.id ? ROOM.open : now };
          const R = ROOMS[m.id]; if (m.tap && R && R.hot) { const h = R.hot.find(x => x.id === m.tap); if (h && h.sfx) play(h.sfx, .8); } } }
      else if (m.type === "msg") { MSG = { text: m.text, t: now }; play("chime", .8); }

      else if (m.type === "pet") { JOY = now; play("giggle"); setTimeout(() => play("heart", .7), 250); }                                     // the pet on the perch was tapped
      else if (m.type === "birth") { BIRTH = { b: m.b, t: now }; // the cocoon beats, cracks open, the butterfly lands

      else { DATA = m; if (!GOT) GOT = now; }
    } catch (err) { showErr(err); }
  });

  ctx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => setTimeout(hello, 300));
  setInterval(hello, 2000);
} catch (err) { /* opened in a normal browser: shows the demo garden */ } });
